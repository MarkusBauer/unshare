[package]
name = "unshare"
description = """
    The low-level interface for linux namespaces (containers)
"""
license = "MIT/Apache-2.0"
readme = "README.md"
keywords = ["linux", "container", "namespace", "docker", "process"]
homepage = "https://github.com/tailhook/unshare"
documentation = "https://docs.rs/unshare"
categories = ["os::unix-apis"]
version = "0.7.1"
authors = ["paul@colomiets.name"]
edition = "2018"

[features]
async = ["dep:tokio"]

[dependencies]
libc = "0.2.170"
nix = { version = "0.21.2" }
tokio = { version = "1", features = ["signal"], optional = true }

[dev-dependencies]
argparse = "0.2.2"
rand = "0.9.0"

[lib]
name = "unshare"
path = "src/lib.rs"

